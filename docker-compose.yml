version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsmind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./opsmind.db
      - HINDSIGHT_BASE_URL=http://localhost:8888
      - HINDSIGHT_BANK_INCIDENTS=opsmind-incidents
      - HINDSIGHT_BANK_SERVICES=opsmind-services
      - HINDSIGHT_BANK_RUNBOOKS=opsmind-runbooks
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - ./backend/data:/app/data
      - opsmind_db_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsmind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  opsmind_db_data:

